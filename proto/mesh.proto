// The mesh index sync protocol, v2. Two kinds of state, deliberately separated:
//
//  * POSSESSION — "origin O currently holds bytes with NAR hash H". Per-origin state with
//    exactly ONE writer (its origin), totally ordered by the origin's own sequence counter;
//    receivers keep one watermark per (peer, origin) and apply events idempotently. Retractable
//    (Have/Drop), snapshottable (the origin's complete current hash set).
//
//  * ATTESTATION — "store path P has content H (size, references), and here is why you can
//    believe it" (a trusted signature over the narinfo fingerprint, or content addressing).
//    Attestations are FACTS: self-verifying, never false, never retracted — a grow-only set,
//    deduped by (store_path, nar_hash) with signature sets unioned. They ride origin journals
//    when first introduced and travel wholesale with snapshot-bearing responses; retention
//    (held-plus-grace) is a local policy, not a protocol concern.
//
// A narinfo lookup composes the two: attestations for the requested hash part yield NAR
// hashes; current holders of those hashes are byte sources. Signatures therefore survive
// holder churn: a host that GC'd a path (or rebuilt it bit-identically) can re-substitute it
// from any current holder under its own old signature.
//
// Protobuf so mixed narshare versions interoperate across a rolling mesh upgrade: add fields,
// never renumber. v1 (fused Add(narinfo)/Remove(path) events) is not spoken anymore; v1 and v2
// nodes simply do not sync until upgraded (the index is disposable, so there is no migration).
syntax = "proto3";
package narshare.mesh.v2;

// One attestation: a verifiable association of a store path with content. Verified by
// receivers on USE (never trusted from the wire): `ca` non-empty (the consuming nix
// re-verifies content addressing at ingestion), or any signature that verifies over the
// narinfo fingerprint (store_path; nar_hash; nar_size; references) under the mesh anchor.
message Attestation {
  string store_path = 1;
  bytes nar_hash = 2;             // 32-byte sha256 of the uncompressed NAR
  uint64 nar_size = 3;
  repeated string references = 4; // basenames, narinfo-style, order signature-exact
  string ca = 5;                  // empty = none
  repeated string sigs = 6;       // "keyname:base64", verbatim
}

// One journal event of an origin.
message Event {
  uint64 seq = 1;
  oneof op {
    bytes have = 2;               // origin now holds bytes with this 32-byte NAR hash
    bytes drop = 3;               // origin no longer holds this NAR hash
    Attestation attest = 4;       // a fact the origin introduces (usually its own export)
  }
}

// The requester's knowledge of one origin — doubles as the ack that lets the responder
// compact its journal ("seq N seen" implies every event <= N was seen).
message OriginClock {
  string origin = 1;
  uint64 generation = 2;          // 0 = nothing known
  uint64 seq = 3;
}

message SyncRequest {
  string requester = 1;           // self-declared node name (validated against config)
  repeated OriginClock have = 2;  // full watermark vector
  // Fact-dump resume cursor: opaque bytes echoed from SyncResponse.atts_next. Non-empty means
  // the requester is mid-dump and wants the next page regardless of snapshot state; empty
  // means "facts only if this response ships a snapshot". Keeps both sides' memory
  // proportional to a page, never to the responder's whole fact table.
  //
  // Consistency: pages read the responder's LIVE table in key order, so a dump is a frontier
  // scan — rows reaped mid-dump simply stop appearing (the cursor is positional, never a row
  // reference), and rows inserted BEHIND the frontier are missed by that dump. Missed rows
  // are harmless as long as the requester still receives their introducing journal events as
  // ordinary suffixes; the requester loses that guarantee exactly when it APPLIES a
  // possession snapshot (forfeiting events wholesale), so at that moment it cancels every
  // in-progress dump and restarts by sending a cursor that precedes every real key.
  // Responders never restart a dump on their own: lag alone must not cost dump progress
  // (compaction floors at the slowest peer's watermark — snapshots ship only on generation
  // changes and backstop overruns, not because a flaky device's peers stayed busy).
  // Requesters persist the cursor across restarts, so a dump survives a process death.
  bytes atts_cursor = 3;
  // Origins whose bodies ANOTHER peer is already streaming to this requester (single-flight
  // catch-up: the requester leases each behind-origin to one weighted-chosen peer per round,
  // so the same journal bytes never travel N times over an N-peer mesh). For a listed origin
  // the responder sends its clock line only — generation and seq, body omitted — and never a
  // suffix, snapshot, or the fact-dump trigger a snapshot carries. The `have` vector stays
  // honest regardless: acks (and therefore compaction floors) are unaffected by skipping.
  repeated string skip_origins = 4;
  // Non-empty makes this a RANGE-ONLY request: the responder answers the asks and nothing
  // else — no origin updates, no snapshots, no fact dump. Journal content at a (generation,
  // seq) is immutable mesh-wide, so a backlog can be fetched as parallel windowed chunks from
  // whichever peers hold it (the requester's catch-up engine assigns chunks by MW weight,
  // exactly like the data plane assigns NAR chunks). Shipped as a FLAG DAY with the paged
  // fact dump: every mesh node speaks ranges, and a response without range replies is a
  // protocol violation, not a version to accommodate (v1/v2 precedent: mixed versions simply
  // do not sync until upgraded — the index is disposable, so there is no migration).
  repeated RangeAsk ranges = 5;
  // Anti-entropy over the fact set. Facts have no watermark — they are an unordered grow-only
  // set — so divergence is found by comparing hashes: the responder's `fact_root` rides EVERY
  // response (16 bytes, so a continuous "are we in sync?" check is free), and when it differs
  // these asks walk a FIXED depth-two 256-ary tree to the differing leaves and fetch them.
  // Two descents locate any difference among 65536 leaves; the depth is a protocol constant,
  // so changing it is a flag day.
  repeated MerkleAsk merkle = 6;
}

// Expand a tree node, and/or fetch the attestations UNDER it. Answers come back as
// SyncResponse.merkle and SyncResponse.attests respectively.
message MerkleAsk {
  // The node: empty = the root (all 65536 leaves), one byte = a coarse bucket, two = a leaf.
  bytes prefix = 1;
  // Send this node's 256 child aggregates (meaningless at leaf depth).
  bool expand = 2;
  // Send the attestations under this node, paged by SyncRequest.atts_cursor and continued via
  // SyncResponse.atts_next — the same paging the full dump uses, because the full dump IS
  // this with an empty prefix.
  //
  // A SUBTREE, not a list of leaves: attestations are keyed by attestation hash, so a node's
  // contents are a contiguous key range. One matching intermediate aggregate therefore means
  // a whole subtree can be fetched from one peer as a sequential scan and inserted in key
  // order — which matters most on a from-scratch sync, where the alternative is tens of
  // thousands of scattered per-leaf fetches and random inserts.
  bool fetch = 3;
}

message MerkleNode {
  bytes prefix = 1;
  // 256 aggregates of 16 bytes each, concatenated, in child order.
  bytes children = 2;
}

// One journal-range ask: origin's events with seq in (after, until], under the responder's
// per-reply byte cap (a short reply is not an error — the requester re-queues the remainder).
message RangeAsk {
  string origin = 1;
  uint64 generation = 2;  // the generation being fetched; a mismatch is unreachable
  uint64 after = 3;       // exclusive
  uint64 until = 4;       // inclusive
}

message RangeReply {
  string origin = 1;
  uint64 generation = 2;  // the responder's current generation for this origin
  uint64 after = 3;       // echo of the ask
  // Contiguous events from after+1 up to at most `until`, possibly short of it (byte cap).
  repeated Event events = 4;
  // False: this responder cannot serve the ask — its journal tail has compacted past
  // `after`, or its generation differs. Try another peer, or fall back to a snapshot.
  bool reachable = 5;
}

// Per-origin answer: nothing new, a journal suffix, or a full snapshot (the recovery path —
// first contact, compacted-past-your-watermark, or generation change).
message OriginUpdate {
  string origin = 1;
  uint64 generation = 2;
  uint64 seq = 3;                 // responder's current seq for this origin
  oneof body {
    bool up_to_date = 4;
    Suffix suffix = 5;
    Snapshot snapshot = 6;
  }
  // Suffix only: more events remain past what fit the response cap; pull again.
  bool truncated = 7;
}

message Suffix {
  repeated Event events = 1;
}

// The origin's complete current possession set. Attestations are NOT per-origin state and
// ride the response instead (SyncResponse.attests).
message Snapshot {
  repeated bytes held = 1;        // 32-byte NAR hashes
}

message SyncResponse {
  string responder = 1;           // self-declared node name (validated against config)
  repeated OriginUpdate origins = 2;
  // Populated whenever any origin update above is a snapshot (or the request carried a
  // resume cursor): a PAGE of the responder's retained attestations, in stable storage
  // order, so the recovery path that loses journal history still learns the facts.
  // Grow-only dedup on apply makes over-delivery harmless.
  repeated Attestation attests = 3;
  // More attestation pages remain: pull again with atts_cursor = atts_next.
  bool atts_truncated = 4;
  bytes atts_next = 5;
  // Answers to SyncRequest.ranges, one per ask, in ask order (range-only responses).
  repeated RangeReply range_replies = 6;
  // XOR of every attestation hash the responder holds — sent on EVERY response. Equal roots
  // mean equal fact sets, so this is a complete divergence check for 16 bytes.
  bytes fact_root = 7;
  // Answers to SyncRequest.merkle; requested leaves' attestations ride `attests`.
  repeated MerkleNode merkle = 8;
}

// "I have news — pull from me." Carries no data: pull is the only data path.
message SyncHint {
  string from = 1;
}
