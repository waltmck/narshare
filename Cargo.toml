[package]
name = "narshare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-contained mesh Nix substituter: serve + dedup + multi-peer NAR striping"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
humantime-serde = "1"
lru = "0.12"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
io-uring = "0.7.14"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
zstd = "0.13.3"
sha2 = "0.10"
blake3 = "1.8.7"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
