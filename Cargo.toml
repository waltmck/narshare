[package]
name = "narshare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-contained mesh Nix substituter: serve + dedup + multi-peer NAR striping"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
humantime-serde = "1"
lru = "0.12"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
io-uring = "0.7.14"
# Verify-only ed25519 (nix binary-cache signatures) at the proxy gate, so a path signed by a key
# the local nix.conf does not trust is refused at narinfo time instead of after the transfer.
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
# The mesh index sync protocol (proto/mesh.proto): protobuf so mixed narshare versions
# interoperate across a rolling mesh upgrade.
prost = "0.13"
# Reacts to the Nix db changing (path registered / GC'd) without polling.
inotify = { version = "0.11", features = ["stream"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
zstd = "0.13.3"
# "asm" routes aarch64 through the SHA-2 crypto extensions (~2.4 GB/s vs ~260 MB/s soft) — the
# NarHash gate is serial on the emit path, so its speed is a whole-transfer throughput ceiling.
sha2 = { version = "0.10", features = ["asm"] }
blake3 = "1.8.7"
serde_json = "1.0.151"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
